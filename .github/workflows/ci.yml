name: CI-heroes

on: [push]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install root dependencies
        run: npm install

      - name: Cypress test
        uses: cypress-io/github-action@v5
        with:
          start: |
            npm run setup
            npm run dev
          working-directory: client
          wait-on: http://localhost:3000